<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — NestPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <h2>Log in to NestPro</h2>
    <p class="sub">Enter your email and we'll send a one-time link — no password to remember.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@company.com" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Send magic link</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
  // --- Supabase setup ---
  const SUPABASE_URL = 'https://xpsolvkafxvchkkrkind.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_K4XzujvQPr5ZKnQF-c7mzQ_ub7AkrNY';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('login-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  // If already logged in, skip straight to dashboard
  client.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const redirectTo = window.location.origin + '/dashboard.html';
    const { error } = await client.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: redirectTo }
    });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Send magic link';

    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg show err';
    } else {
      msg.textContent = 'Check your email — we sent a link to log in. It may take a minute to arrive.';
      msg.className = 'msg show ok';
      form.reset();
    }
  });
</script>

</body>
</html>
